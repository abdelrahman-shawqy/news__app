publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.1

#
dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  google_fonts: ^8.1.0
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  loader_overlay: ^5.0.0
  injectable: ^3.0.0
  get_it: ^9.2.1
  connectivity_plus: ^7.3.1
  internet_connection_checker_plus: ^3.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: 3.0.0
  build_runner: ^2.15.1


flutter:


