flutter_native_splash:

  color: "#ffffff"  ##====================================[REQUIRED]==========
  #color_dark: "#171717"

  background_image:  "assets/images/splash_logo.png"
  #background_image_dark: "assets/images/splash_logo.png"
  #branding:      assets/images/splash_branding.png
